name: 'Mudança de alto risco (CCM)'
description: 'Mudança que exige decisão do Comitê de Controle de Mudanças (PGC 8.2)'
title: '[Alto risco] '
labels: [ccm]
body:
  - type: markdown
    attributes:
      value: |
        Use este formulário só para mudanças previstas no PGC 8.2.
        O CCM (Desenvolvedora Líder + par de revisão) registra a decisão nos comentários.
  - type: checkboxes
    id: criterio
    attributes:
      label: 'Por que é alto risco?'
      options:
        - label: 'Altera a estrutura de dados já salvos (ex.: campos do modelo Game depois de haver persistência)'
        - label: 'Envolve dados pessoais de jogadores, como e-mail ou conta (LGPD)'
        - label: 'Exceção ao fluxo padrão (ex.: hotfix direto em produção)'
  - type: textarea
    id: descricao
    attributes:
      label: 'Descrição da mudança'
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: 'Plano de rollback'
      description: 'Como voltar atrás se der errado: tag anterior (workflow Rollback), script de reversão, backup.'
    validations:
      required: true
  - type: textarea
    id: decisao
    attributes:
      label: 'Decisão do CCM (preenchido pelo comitê)'
      placeholder: 'Aprovada | Aprovada com ressalvas | Rejeitada — justificativa'
