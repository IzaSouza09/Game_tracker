name: Defeito
description: Relate algo que não funciona como esperado
labels: ["defeito"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      options:
        - Android
        - Web
        - Windows
        - Linux
    validations:
      required: true
