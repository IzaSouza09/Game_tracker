name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria
title: 'feat: '
labels: [funcionalidade]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade do jogador isto atende?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O jogador consegue...
        - [ ] O app impede...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - telas (lib/screens)
        - modelos e dados (lib/models)
        - estatísticas
        - plataformas (android/web/windows/linux)
        - pipeline/infra
    validations:
      required: true
